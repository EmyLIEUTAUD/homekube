apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:2.20.0@sha256:8ffd737c69a569bbdadc118e7f54b0b1050ffac2868fdf9e390a68cb7c82a79d
        containerPort: 8000
        env:
          - name: TZ
            value: Europe/Paris
          - name: PAPERLESS_TIME_ZONE
            value: Europe/Paris
          - name: PAPERLESS_OCR_LANGUAGE
            value: fra
          - name: PAPERLESS_BIND_ADDR
            value: 0.0.0.0
          - name: PAPERLESS_URL
            value: http://paperless.home
          - name: PAPERLESS_REDIS
            value: redis://paperless-redis:6379
          - name: PAPERLESS_DBHOST
            valueFrom:
              secretKeyRef:
                name: paperless-database-app
                key: host
          - name: PAPERLESS_DBPORT
            valueFrom:
              secretKeyRef:
                name: paperless-database-app
                key: port
          - name: PAPERLESS_DBUSER
            valueFrom:
              secretKeyRef:
                name: paperless-database-app
                key: user
          - name: PAPERLESS_DBPASS
            valueFrom:
              secretKeyRef:
                name: paperless-database-app
                key: password
          - name: PAPERLESS_DBNAME
            valueFrom:
              secretKeyRef:
                name: paperless-database-app
                key: dbname
        volumeMounts:
          - name: paperless-data
            mountPath: /usr/src/paperless/data
          - name: paperless-media
            mountPath: /usr/src/paperless/media
          - name: paperless-export
            mountPath: /usr/src/paperless/export
          - name: paperless-consume
            mountPath: /usr/src/paperless/consume
        volumes:
          - name: paperless-data
            persistentVolumeClaim:
              claimName: paperless-data
          - name: paperless-media
            persistentVolumeClaim:
              claimName: paperless-media
          - name: paperless-export
            persistentVolumeClaim:
              claimName: paperless-export
          - name: paperless-consume
            persistentVolumeClaim:
              claimName: paperless-consume
        service: 8000
        ingress:
          domain: paperless.home
        pvc:
          - paperless-data
          - paperless-media
          - paperless-export
          - paperless-consume

      - name: paperless-redis
        image: redis:8.4.0-bookworm@sha256:43355efd22490e31ca14b9d569367d05121e2be61fd8e47937563ae2a80952ae
        containerSpec:
          resources:
            limits:
              cpu: 40m
              memory: 8Mi
            requests:
              cpu: 40m
              memory: 8Mi
        service: 6379
