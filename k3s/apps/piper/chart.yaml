apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: piper
        image: rhasspy/wyoming-piper:2.4.2@sha256:72ee1b06b062cb14f4a70de002eb420a068efd5a7a8cb7620be6bf600307f867
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--voice"
          - "fr_FR-upmc-medium"
        volumeMounts:
          - name: piper-data
            mountPath: /data
        volumes:
          - name: piper-data
            persistentVolumeClaim:
              claimName: piper-data
        service: 10200
        ingress:
          domain: piper.lan
        pvc:
          - piper-data
