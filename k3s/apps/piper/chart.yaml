apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: piper
        image: rhasspy/wyoming-piper:2.5.4@sha256:333622ab9e4bcd00c80a37219b90a1a9d6aa3fd1ad34e0a6e3bddd36ee999efd
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--voice"
          - "fr_FR-upmc-medium"
        volumeMounts:
          - name: piper-data
            mountPath: /data
        volumes:
          - name: piper-data
            persistentVolumeClaim:
              claimName: piper-data
        service: 10200
        ingress:
          domain: piper.lan
        pvc:
          - piper-data
