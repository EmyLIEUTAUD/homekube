apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: home-assistant
        image: homeassistant/home-assistant:2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
        containerPort: 8123
        volumeMounts:
          - name: home-assistant-config
            mountPath: /config
          - name: home-assistant-localtime
            mountPath: /etc/localtime
          - name: home-assistant-dbus
            mountPath: /run/dbus
        volumes:
          - name: home-assistant-config
            persistentVolumeClaim:
              claimName: home-assistant-config
          - name: home-assistant-localtime
            persistentVolumeClaim:
              claimName: home-assistant-localtime
          - name: home-assistant-dbus
            persistentVolumeClaim:
              claimName: home-assistant-dbus
        service: 8123
        ingress:
          domain: home-assistant.lan
        pvc:
          - home-assistant-config
          - home-assistant-localtime
          - home-assistant-dbus
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "1.5Gi"
