apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: whisper
        image: rhasspy/wyoming-whisper:3.4.1@sha256:9f35594df729b2c1d3fa9a69d1faf4432082ed6dab2ba87da1d5a58f4e4e8f52
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--model"
          - "medium"
          - "--language"
          - "fr"
        volumeMounts:
          - name: whisper-data
            mountPath: /data
        volumes:
          - name: whisper-data
            persistentVolumeClaim:
              claimName: whisper-data
        service: 10300
        ingress:
          domain: whisper.lan
        pvc:
          - whisper-data
