apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: whisper
        image: rhasspy/wyoming-whisper:3.5.0@sha256:308b7959a925d0cca381c3e6e77292fed87822695635db39c24199d6b7a9e610
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--model"
          - "medium"
          - "--language"
          - "fr"
        volumeMounts:
          - name: whisper-data
            mountPath: /data
        volumes:
          - name: whisper-data
            persistentVolumeClaim:
              claimName: whisper-data
        service: 10300
        ingress:
          domain: whisper.lan
        pvc:
          - whisper-data
