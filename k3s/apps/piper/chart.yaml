apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: piper
        image: rhasspy/wyoming-piper:2.3.1@sha256:69b7f797ae3a8c3c0202cbf97152fb795d78c2355de2a31655c20671247360d8
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--voice"
          - "fr_FR-upmc-medium"
        volumeMounts:
          - name: piper-data
            mountPath: /data
        volumes:
          - name: piper-data
            persistentVolumeClaim:
              claimName: piper-data
        service: 10200
        ingress:
          domain: piper.lan
        pvc:
          - piper-data
