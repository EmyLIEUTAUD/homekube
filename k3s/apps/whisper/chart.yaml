apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: whisper
        image: rhasspy/wyoming-whisper:3.6.0@sha256:b7da5869ac9caba5f8db1c0dec373fb46a58d31f4aee1855faa7b49b7c0d4b49
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--model"
          - "medium"
          - "--language"
          - "fr"
        volumeMounts:
          - name: whisper-data
            mountPath: /data
        volumes:
          - name: whisper-data
            persistentVolumeClaim:
              claimName: whisper-data
        service: 10300
        ingress:
          domain: whisper.lan
        pvc:
          - whisper-data
