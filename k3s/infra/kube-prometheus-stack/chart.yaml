---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 15m
  url: https://prometheus-community.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.20.0
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
  values:
    alertmanager:
      enabled: false
    grafana:
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: supervision-grafana-cors-header@kubernetescrd
        hosts:
          - grafana.lan
        ingressClassName: traefik
      persistence:
        enabled: true
        type: pvc
        storageClassName: nfs
        accessModes:
          - ReadWriteOnce
        size: 1Gi
    prometheus:
      prometheusSpec:
        additionalScrapeConfigs:
          - job_name: 'jellyfin'
            metrics_path: /metrics
            scheme: http
            static_configs:
              - targets: ['jellyfin.jellyfin.cluster.svc.local:8096']
