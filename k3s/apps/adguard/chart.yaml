apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: adguard
        image: adguard/adguardhome:v1.0.0@sha256:f00a586f0d1caa74f149340bfb225014960310488ffa838406b89256900a96c2
        env:
          - name: TZ
            value: Europe/Paris
        volumeMounts:
          - name: adguard-work
            mountPath: /opt/adguardhome/work
          - name: adguard-conf
            mountPath: /opt/adguardhome/conf
        volumes:
          - name: adguard-work
            persistentVolumeClaim:
              claimName: adguard-work
          - name: adguard-conf
            persistentVolumeClaim:
              claimName: adguard-conf
        service: 80
        ingress:
          domain: adguard.lan
        pvc:
          - adguard-work
          - adguard-conf
