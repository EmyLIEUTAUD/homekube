apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: adguard
        image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
        env:
          - name: TZ
            value: Europe/Paris
        volumeMounts:
          - name: adguard-work
            mountPath: /opt/adguardhome/work
          - name: adguard-conf
            mountPath: /opt/adguardhome/conf
        volumes:
          - name: adguard-work
            persistentVolumeClaim:
              claimName: adguard-work
          - name: adguard-conf
            persistentVolumeClaim:
              claimName: adguard-conf
        service: 80
        ingress:
          domain: adguard.lan
        pvc:
          - adguard-work
          - adguard-conf
