apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: tdarr
        image: haveagitgat/tdarr:2.86.01
        podSecurityContext:
          privileged: true
        env:
          - name: TZ
            value: Europe/Paris
          - name: serverIP
            value: 0.0.0.0
          - name: serverPort
            value: "8266"
          - name: webUIPort
            value: "8265"
          - name: internalNode
            value: "true"
          - name: nodeName
            value: jellyfin-node
          - name: inContainer
            value: "true"
          - name: ffmpegVersion
            value: "7"
          - name: transcodegpuWorkers
            value: "1"
          - name: transcodecpuWorkers
            value: "1"
          - name: healthcheckgpuWorkers
            value: "1"
          - name: healthcheckcpuWorkers
            value: "1"
        volumeMounts:
          - name: tdarr-server
            mountPath: /app/server
          - name: tdarr-config
            mountPath: /app/configs
          - name: tdarr-temp
            mountPath: /temp
          - name: jellyfin-media
            mountPath: /media
          - name: dri
            mountPath: /dev/dri
        volumes:
          - name: tdarr-server
            hostPath:
              path: /home/homekube/tdarr/server
              type: DirectoryOrCreate
          - name: tdarr-config
            hostPath:
              path: /home/homekube/tdarr/configs
              type: DirectoryOrCreate
          - name: tdarr-temp
            hostPath:
              path: /home/homekube/tdarr/temp
              type: DirectoryOrCreate
          - name: jellyfin-media
            persistentVolumeClaim:
              claimName: jellyfin-media
          - name: dri
            hostPath:
              path: /dev/dri
              type: Directory
        containerPort: 8265
        service: 8265
        ingress:
          domain: tdarr.lan
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"