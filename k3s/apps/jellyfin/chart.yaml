apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: jellyfin
        image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
        podSecurityContext:
          privileged: true
        env:
          - name: JELLYFIN_CONFIG_DIR
            value: /config
          - name: JELLYFIN_DATA_DIR
            value: /data
          - name: JELLYFIN_CACHE_DIR
            value: /cache
          - name: TZ
            value: Europe/Paris
        volumeMounts:
          - name: jellyfin-config
            mountPath: /config
          - name: jellyfin-data
            mountPath: /data
          - name: jellyfin-cache
            mountPath: /cache
          - name: jellyfin-media
            mountPath: /media
          - name: dri
            mountPath: /dev/dri
        volumes:
          - name: jellyfin-config
            hostPath:
              path: /home/homekube/jellyfin/config
              type: DirectoryOrCreate
          - name: jellyfin-data
            hostPath:
              path: /home/homekube/jellyfin/data
              type: DirectoryOrCreate
          - name: jellyfin-cache
            hostPath:
              path: /home/homekube/jellyfin/cache
              type: DirectoryOrCreate
          - name: jellyfin-media
            persistentVolumeClaim:
              claimName: jellyfin-media
          - name: dri
            hostPath:
              path: /dev/dri
              type: Directory
        service: 8096
        ingress:
          domain: jellyfin.lan
        pvc:
          - jellyfin-media
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
