apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adguard
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: adguard
        image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
        env:
          - name: TZ
            value: Europe/Paris
        volumeMounts:
          - name: adguard-work
            mountPath: /opt/adguardhome/work
          - name: adguard-conf
            mountPath: /opt/adguardhome/conf
        volumes:
          - name: adguard-work
            persistentVolumeClaim:
              claimName: adguard-work
          - name: adguard-conf
            persistentVolumeClaim:
              claimName: adguard-conf
        service: 80
        ingress:
          domain: adguard.lan
        pvc:
          - adguard-work
          - adguard-conf
