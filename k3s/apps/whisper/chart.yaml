apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: whisper
        image: rhasspy/wyoming-whisper:3.0.2@sha256:995b37523bc422f4f7649e50ccded97a5b9bf6d1d0420591183a778dd5d7d3f2
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--model"
          - "medium"
          - "--language"
          - "fr"
        volumeMounts:
          - name: whisper-data
            mountPath: /data
        volumes:
          - name: whisper-data
            persistentVolumeClaim:
              claimName: whisper-data
        service: 10300
        ingress:
          domain: whisper.home
        pvc:
          - whisper-data
