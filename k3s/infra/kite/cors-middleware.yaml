apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kite-cors-header
spec:
  headers:
    accessControlAllowHeaders:
    - '*'
    accessControlAllowMethods:
    - GET
    - OPTIONS
    - PUT
    accessControlAllowOriginList:
    - http://kite.lan
    - http://home.lan
    accessControlMaxAge: 100
    addVaryHeader: true
