apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: home-assistant
        image: homeassistant/home-assistant:2026.6.1@sha256:59aa8824955c9db491b75d2eebe42bd68494f80c2ec69ec0d66d9dae37d37514
        containerPort: 8123
        volumeMounts:
          - name: home-assistant-config
            mountPath: /config
          - name: home-assistant-localtime
            mountPath: /etc/localtime
          - name: home-assistant-dbus
            mountPath: /run/dbus
        volumes:
          - name: home-assistant-config
            persistentVolumeClaim:
              claimName: home-assistant-config
          - name: home-assistant-localtime
            persistentVolumeClaim:
              claimName: home-assistant-localtime
          - name: home-assistant-dbus
            persistentVolumeClaim:
              claimName: home-assistant-dbus
        service: 8123
        ingress:
          domain: home-assistant.lan
        pvc:
          - home-assistant-config
          - home-assistant-localtime
          - home-assistant-dbus
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1500m"
            memory: "1.5Gi"
