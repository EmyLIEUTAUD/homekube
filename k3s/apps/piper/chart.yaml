apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: piper
        image: rhasspy/wyoming-piper:2.5.1@sha256:a61b12575e5a05b307983c3172bdf03ef7dd68a6f6093f3b6105a0c65004d0a3
        env:
          - name: TZ
            value: Europe/Paris
        args:
          - "--voice"
          - "fr_FR-upmc-medium"
        volumeMounts:
          - name: piper-data
            mountPath: /data
        volumes:
          - name: piper-data
            persistentVolumeClaim:
              claimName: piper-data
        service: 10200
        ingress:
          domain: piper.lan
        pvc:
          - piper-data
