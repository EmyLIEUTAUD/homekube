apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer
spec:
  interval: 10m
  chart:
    spec:
      chart: ./k3s/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    apps:
      - name: homer
        image: b4bz/homer:v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
        containerPort: 8080
        volumeMounts:
          - name: homer-config
            mountPath: /www/assets
        volumes:
          - name: homer-config
            configMap:
              name: homer-config
        service: 8080
        ingress:
          domain: home.lan
        env:
          - name: INIT_ASSETS
            value: "1"
          - name: TZ
            value: Europe/Paris
